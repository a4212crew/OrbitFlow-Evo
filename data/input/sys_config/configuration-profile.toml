[teleport]
proxy = "teleport.lynhamnetworks.au:443"
cluster = "lynhamcluster"
bastion_host = "bastion-lyn-dc1-vic"
bastion_user = "lightningadmin"
teleport_key_path = "/home/maxlee/.tsh/keys/teleport.lynhamnetworks.au/mlee"
teleport_cert_path = "/home/maxlee/.tsh/keys/teleport.lynhamnetworks.au/mlee-ssh/lynhamcluster-cert.pub"
[execution]
connection_start_interval = 1.0
connection_retry_delay = 5.0
[paths]
devices = "data/input/devices.xlsx"
templates = "data/input/generated_template"
plans = "outputs/reports/plan_configuration"
execution_reports = "outputs/reports/configuration_execution"
inventory = "data/inventory/inventory.json"
