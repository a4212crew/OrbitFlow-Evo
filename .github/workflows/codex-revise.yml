name: Codex Revision

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  revise:
    if: github.event.label.name == 'codex-revise' && github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v5
        with:
          ref: codex/issue-${{ github.event.issue.number }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare revision and enforce iteration limit
        id: prep
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issue = context.payload.issue;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            let current = 0;
            for (const comment of comments) {
              const match = (comment.body || "").match(/<!-- orbitflow-codex-iteration:(\d+) -->/);
              if (match) current = Math.max(current, Number(match[1]));
            }

            if (current >= 15) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["codex-replan-required"],
              });
              for (const name of ["codex-revise", "codex-running", "codex-review"]) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "The current implementation plan has reached the **15-iteration limit**. Automated Codex revision is stopped. Atlas and the user must revisit and approve the implementation plan before a new implementation cycle begins.",
              });
              core.setOutput("run", "false");
              return;
            }

            const reviews = comments.filter(
              (comment) =>
                comment.user?.login === context.repo.owner &&
                (comment.body || "").includes("<!-- atlas-review -->")
            );
            if (reviews.length === 0) {
              core.setFailed("No Atlas review comment containing <!-- atlas-review --> was found.");
              return;
            }

            const review = reviews[reviews.length - 1].body;
            const next = current + 1;
            const preamble = fs.readFileSync(".github/codex/task-preamble.md", "utf8");
            const prompt = [
              preamble,
              "",
              "# Original task",
              `GitHub issue #${issue.number}: ${issue.title}`,
              "",
              issue.body || "(No issue body provided.)",
              "",
              "# Atlas review corrections",
              review,
              "",
              "# Iteration",
              `This is implementation/review iteration ${next} of a maximum 15 under the current approved plan.`,
              "Address the Atlas review findings only; preserve unrelated working behavior.",
            ].join("\n");

            fs.writeFileSync(".codex-prompt.md", prompt);
            core.setOutput("run", "true");
            core.setOutput("iteration", String(next));

      - name: Mark revision running
        if: steps.prep.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-running"],
            });
            for (const name of ["codex-revise", "codex-review", "codex-failed"]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Run Codex revision
        if: steps.prep.outputs.run == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ".codex-prompt.md"

      - name: Remove transient prompt
        if: always()
        run: rm -f .codex-prompt.md

      - name: Run deterministic test suite
        if: steps.prep.outputs.run == 'true'
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Require revision changes
        if: steps.prep.outputs.run == 'true'
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Codex produced no repository changes for the requested revision."
            exit 1
          fi

      - name: Commit and push revision
        if: steps.prep.outputs.run == 'true'
        env:
          ITERATION: ${{ steps.prep.outputs.iteration }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Codex: revise issue #${{ github.event.issue.number }} iteration $ITERATION"
          git push origin HEAD

      - name: Return task to Atlas review
        if: steps.prep.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          ITERATION: ${{ steps.prep.outputs.iteration }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-review"],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: "codex-running",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                `<!-- orbitflow-codex-iteration:${process.env.ITERATION} -->`,
                `Codex revision iteration **${process.env.ITERATION}/15** is ready for Atlas review.`,
                `Automated tests: **${process.env.TEST_OUTCOME}**`,
                "The existing pull request branch has been updated.",
              ].join("\n"),
            });

      - name: Mark revision failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-failed"],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: "codex-running",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "Codex revision workflow failed before returning to Atlas review. Inspect the GitHub Actions run before retrying.",
            });
