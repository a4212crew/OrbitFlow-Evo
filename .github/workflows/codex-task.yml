name: Codex Task

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'codex-task' && github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare Codex prompt
        id: task
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issue = context.payload.issue;
            const preamble = fs.readFileSync(".github/codex/task-preamble.md", "utf8");
            const branch = `codex/issue-${issue.number}`;
            const prompt = [
              preamble,
              "",
              "# Task",
              `GitHub issue #${issue.number}: ${issue.title}`,
              "",
              issue.body || "(No issue body provided.)",
              "",
              "# Iteration",
              "This is implementation/review iteration 1 of a maximum 15 under the current approved plan.",
            ].join("\n");

            fs.writeFileSync(".codex-prompt.md", prompt);
            core.setOutput("branch", branch);

      - name: Create isolated task branch
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; refusing duplicate initial execution."
            exit 1
          fi
          git switch -c "$BRANCH"

      - name: Mark task running
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-running"],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: "codex-task",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: ".codex-prompt.md"

      - name: Remove transient prompt
        if: always()
        run: rm -f .codex-prompt.md

      - name: Run deterministic test suite
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Require implementation changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Codex produced no repository changes."
            exit 1
          fi

      - name: Commit and push Codex changes
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Codex: implement issue #${{ github.event.issue.number }} iteration 1"
          git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        id: pr
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.task.outputs.branch }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const issue = context.payload.issue;
            const result = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.BRANCH,
              base: "main",
              title: `Codex: #${issue.number} ${issue.title}`,
              body: [
                `Implements OrbitFlow-Evo issue #${issue.number}.`,
                "",
                "Generated by the controlled Codex orchestration workflow.",
                `Iteration: 1/15`,
                `Automated tests: ${process.env.TEST_OUTCOME}`,
                "",
                "Atlas review and explicit human merge approval are required.",
              ].join("\n"),
            });
            core.setOutput("number", result.data.number);
            core.setOutput("url", result.data.html_url);

      - name: Move task to Atlas review
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-review", "codex-pr"],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: "codex-running",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                "<!-- orbitflow-codex-iteration:1 -->",
                "Codex implementation iteration **1/15** is ready for Atlas review.",
                `PR: ${process.env.PR_URL}`,
                `Automated tests: **${process.env.TEST_OUTCOME}**`,
              ].join("\n"),
            });

      - name: Mark workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ["codex-failed"],
            });
            for (const name of ["codex-running"]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: "Codex orchestration failed before reaching Atlas review. Inspect the GitHub Actions run before retrying.",
            });
