name: Codex Orchestration Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Verify OpenAI API secret exists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository Actions secret is not configured."
            exit 1
          fi

      - name: Ensure orchestration labels exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const labels = [
              ["codex-task", "1D76DB", "Task approved for Codex implementation"],
              ["codex-running", "FBCA04", "Codex implementation is running"],
              ["codex-review", "5319E7", "Waiting for Atlas review"],
              ["codex-revise", "D93F0B", "Atlas requested another Codex revision"],
              ["codex-approved", "0E8A16", "Atlas review passed"],
              ["codex-pr", "8250DF", "Task has an open Codex pull request"],
              ["codex-failed", "B60205", "Codex workflow failed"],
              ["codex-replan-required", "B60205", "15-iteration limit reached; implementation plan must be revisited"],
            ];

            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
              }
            }

            core.notice("Codex orchestration labels are ready.");
